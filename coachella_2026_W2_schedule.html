<html lang="en">
<head>
<meta charset="UTF-8">

<title>Coachella 2026 — Weekend 2 Schedule</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, serif; background: #0d0d1a; color: #f0e6d0; min-height: 100vh; overflow-x: hidden; }

  /* ── Top bar ── */
  .topbar { background: #1A1A2E; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; border-bottom: 2px solid #D4A847; position: sticky; top: 0; z-index: 200; }
  .topbar h1 { font-size: 1.15rem; color: #f0e6d0; white-space: nowrap; }
  .topbar h1 span { color: #D4A847; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* Day tabs */
  .day-tabs { display: flex; background: #111128; border-radius: 7px; overflow: hidden; border: 1px solid #333; }
  .day-tab { padding: 6px 14px; cursor: pointer; font-family: Georgia, serif; font-size: 0.82rem; color: #aaa; background: transparent; border: none; transition: all 0.15s; white-space: nowrap; }
  .day-tab.active { background: #D4A847; color: #1A1A2E; font-weight: bold; }
  .day-tab:hover:not(.active) { background: #222244; color: #f0e6d0; }

  /* TZ selector */
  .tz-select { font-family: Georgia, serif; background: #1A1A2E; border: 1px solid #D4A847; color: #f0e6d0; padding: 6px 12px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; }

  /* Legend */
  .legend { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px; background: #111128; border-bottom: 1px solid #1e1e38; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.68rem; color: #bbb; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .legend-w2 { border: 2px dashed rgba(255,255,255,0.45); background: transparent; }

  /* Day label bar */
  .day-label { padding: 6px 16px; background: #0f0f22; font-size: 0.78rem; color: #D4A847; border-bottom: 1px solid #1e1e38; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── Schedule outer scroll ── */
  .schedule-outer { overflow-x: auto; overflow-y: visible; -webkit-overflow-scrolling: touch; }

  /* ── Inner fixed-width wrapper — both header and body inside this ── */
  .schedule-inner { width: 1252px; position: relative; }

  /* Stage header — sticky top, full width of inner */
  .stage-header-row {
    display: flex;
    position: sticky;
    top: 0;   /* sticks within the topbar's z-context; actual offset set by JS */
    z-index: 50;
    background: #1A1A2E;
    border-bottom: 2px solid #333;
    width: 1252px;
  }
  .time-gutter { width: 52px; min-width: 52px; flex-shrink: 0; background: #1A1A2E; }
  .stage-header {
    width: 150px;
    min-width: 150px;
    flex-shrink: 0;
    padding: 9px 4px;
    text-align: center;
    font-size: 0.7rem;
    font-weight: bold;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border-left: 1px solid rgba(255,255,255,0.1);
    line-height: 1.25;
  }

  /* Grid body */
  .grid-body { display: flex; width: 1252px; }
  .time-col { width: 52px; min-width: 52px; flex-shrink: 0; position: relative; }
  .time-label { position: absolute; right: 4px; font-size: 0.65rem; color: #777; transform: translateY(-50%); white-space: nowrap; }

  /* Stage columns */
  .stage-col {
    width: 150px;
    min-width: 150px;
    flex-shrink: 0;
    position: relative;
    border-left: 1px solid rgba(255,255,255,0.07);
  }
  .hour-line { position: absolute; left: 0; right: 0; border-top: 1px solid rgba(255,255,255,0.08); pointer-events: none; }
  .half-line { position: absolute; left: 0; right: 0; border-top: 1px dashed rgba(255,255,255,0.04); pointer-events: none; }

  /* Artist blocks */
  .artist-block {
    position: absolute;
    left: 3px;
    right: 3px;
    border-radius: 5px;
    cursor: pointer;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 3px 6px;
    border: none;
    text-align: left;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .artist-block:hover, .artist-block:active { transform: scale(1.02); box-shadow: 0 4px 16px rgba(0,0,0,0.6); z-index: 20; }
  .artist-block.w2only { outline: 2px dashed rgba(255,255,255,0.38); outline-offset: -2px; }
  .artist-name { font-size: 0.72rem; font-weight: bold; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .artist-time { font-size: 0.6rem; opacity: 0.85; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── Popup ── */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.78); z-index: 300; backdrop-filter: blur(3px); }
  .overlay.active { display: flex; align-items: center; justify-content: center; padding: 16px; }
  .popup { background: #1c1c35; border: 1px solid #444; border-radius: 14px; max-width: 460px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.85); }
  .popup-header { padding: 16px 18px 12px; border-bottom: 1px solid #2e2e4e; }
  .popup-close { float: right; background: none; border: none; color: #777; font-size: 1.5rem; cursor: pointer; line-height: 1; margin-left: 8px; }
  .popup-close:hover { color: #f0e6d0; }
  .popup-stage-tag { display: inline-block; padding: 3px 11px; border-radius: 20px; font-size: 0.68rem; font-weight: bold; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 7px; }
  .popup-artist { font-size: 1.2rem; font-weight: bold; color: #f0e6d0; line-height: 1.25; }
  .popup-time { font-size: 0.82rem; color: #999; margin-top: 4px; }
  .popup-body { padding: 14px 18px; }
  .popup-row { margin-bottom: 11px; }
  .popup-label { font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.08em; color: #777; margin-bottom: 2px; }
  .popup-value { font-size: 0.88rem; color: #e0d8c8; line-height: 1.5; }
  .popup-praise { font-style: italic; color: #aed6a0; }
  .popup-snark  { font-style: italic; color: #d4b87a; }
  .popup-misc   { font-size: 0.8rem; color: #999; }
  .popup-buttons { display: flex; gap: 8px; padding: 0 18px 16px; flex-wrap: wrap; }
  .popup-btn { flex: 1; min-width: 110px; padding: 9px 12px; border-radius: 8px; border: none; cursor: pointer; font-family: Georgia, serif; font-size: 0.82rem; font-weight: bold; text-decoration: none; text-align: center; display: inline-block; transition: opacity 0.15s; }
  .popup-btn:hover { opacity: 0.82; }
  .btn-apple   { background: #fc3158; color: #fff; }
  .btn-spotify { background: #1DB954; color: #fff; }
  .btn-youtube { background: #FF0000; color: #fff; }
  .w2badge { display: inline-block; background: #2a4a6e; color: #aed6f1; font-size: 0.62rem; padding: 2px 8px; border-radius: 10px; margin-left: 8px; vertical-align: middle; font-weight: normal; font-style: normal; }
</style>

"endMin": 1200, "timeStr": "6:00–8:00pm", "genre": "House / Electronic", "rating": "⭐⭐⭐⭐⭐", "vibe": "Soulful house energy", "praise": "One of the most exciting DJs working right now — technically brilliant, emotionally generous, and relentlessly joyful.", "snark": "Will ruin all other Sunday afternoon DJ sets for you permanently.", "misc": "W2 Quasar exclusive", "w2only": true, "appleMusic": "https://music.apple.com/us/artist/lp-giobbi/1457553073", "spotify": "https://open.spotify.com/artist/28BoHRPB4tLNHBJVXZYnLH", "youtube": "https://www.youtube.com/@Coachella/streams", "color": "#6B4F8A", "textColor": "#ffffff"}]};
const STAGES      = ["Coachella Stage", "Outdoor Theatre", "Mojave", "Sahara", "Gobi", "Sonora", "Yuma", "Quasar"];
const STAGE_COLORS= {"Coachella Stage": "#C0392B", "Outdoor Theatre": "#4A90D9", "Mojave": "#B5651D", "Sahara": "#D4A847", "Gobi": "#A89070", "Sonora": "#C86B3A", "Yuma": "#7A9E7E", "Quasar": "#6B4F8A"};
const STAGE_TEXT  = {"Coachella Stage": "#ffffff", "Outdoor Theatre": "#ffffff", "Mojave": "#ffffff", "Sahara": "#1a1a1a", "Gobi": "#ffffff", "Sonora": "#ffffff", "Yuma": "#ffffff", "Quasar": "#ffffff"};
const DAY_DATES   = {"Friday": "April 17", "Saturday": "April 18", "Sunday": "April 19"};
const TZ_OFFSETS  = {"PT": 0, "CT": 2, "ET": 3};
const TZ_LABELS   = {"PT": "Pacific Time (PT)", "CT": "Central Time (CT)", "ET": "Eastern Time (ET)"};
const TZ_LOCS     = {"PT": "Indio, CA", "CT": "Oklahoma City", "ET": "North Carolina"};
const STAGE_YT = {
  "Coachella Stage": "https://www.youtube.com/results?search_query=coachella+2026+coachella+stage+weekend+2+live",
  "Outdoor Theatre": "https://www.youtube.com/results?search_query=coachella+2026+outdoor+theatre+weekend+2+live",
  "Mojave":          "https://www.youtube.com/results?search_query=coachella+2026+mojave+stage+weekend+2+live",
  "Sahara":          "https://www.youtube.com/results?search_query=coachella+2026+sahara+stage+weekend+2+live",
  "Gobi":            "https://www.youtube.com/results?search_query=coachella+2026+gobi+stage+weekend+2+live",
  "Sonora":          "https://www.youtube.com/results?search_query=coachella+2026+sonora+stage+weekend+2+live",
  "Yuma":            "https://www.youtube.com/results?search_query=coachella+2026+yuma+stage+weekend+2+live",
  "Quasar":          "https://www.youtube.com/results?search_query=coachella+2026+quasar+stage+weekend+2+live",
};

const PXPH       = 120;
const PT_START   = 780;
const PT_END     = 1500;
const TIME_COL_W = 52;
const STAGE_COL_W= 150;

let currentDay = 'Friday';
let currentTZ  = 'PT';

function fmt(ptMins, off) {
  const m = ptMins + off * 60;
  const hRaw = Math.floor(m / 60) % 24;
  const min  = m % 60;
  const per  = hRaw < 12 ? 'am' : 'pm';
  const h    = hRaw === 0 ? 12 : hRaw > 12 ? hRaw - 12 : hRaw;
  return h + ':' + String(min).padStart(2,'0') + per;
}

function renderSchedule() {
  const artists = ALL_DATA[currentDay] || [];
  const off     = TZ_OFFSETS[currentTZ];
  const dispStart = PT_START + off * 60;
  const dispEnd   = PT_END   + off * 60;
  const totalMins = dispEnd - dispStart;
  const totalPx   = totalMins / 60 * PXPH;

  // Stage header
  const stageHeaderHTML =
    `<div class="stage-header-row">` +
    `<div class="time-gutter"></div>` +
    STAGES.map(s =>
      `<div class="stage-header" style="background:${STAGE_COLORS[s]};color:${STAGE_TEXT[s]||'#fff'};">${s}</div>`
    ).join('') +
    `</div>`;

  // Time labels
  const timeLabels = [];
  for (let ptM = PT_START; ptM <= PT_END; ptM += 60) {
    const dispM = ptM + off * 60;
    const topPx = (dispM - dispStart) / 60 * PXPH;
    timeLabels.push(`<div class="time-label" style="top:${topPx}px">${fmt(ptM, off)}</div>`);
  }

  // Grid lines
  const gridLines = [];
  for (let ptM = PT_START; ptM <= PT_END; ptM += 30) {
    const dispM = ptM + off * 60;
    const topPx = (dispM - dispStart) / 60 * PXPH;
    const cls = (ptM % 60 === 0) ? 'hour-line' : 'half-line';
    gridLines.push(`<div class="${cls}" style="top:${topPx}px"></div>`);
  }
  const gridLinesHTML = gridLines.join('');

  // Stage columns
  const stageCols = STAGES.map(stage => {
    const stageArtists = artists.filter(a => a.stage === stage);
    const blocks = stageArtists.map(a => {
      const dispS = a.startMin + off * 60;
      const dispE = a.endMin   + off * 60;
      const topPx = (dispS - dispStart) / 60 * PXPH;
      const htPx  = Math.max((dispE - dispS) / 60 * PXPH - 2, 14);
      const dispT = fmt(a.startMin, off) + '–' + fmt(a.endMin, off);
      const w2cls = a.w2only ? ' w2only' : '';
      const shortName = a.name.length > 20 ? a.name.slice(0,19) + '…' : a.name;
      const dataAttr  = encodeURIComponent(JSON.stringify(a));
      return `<button class="artist-block${w2cls}"
        style="top:${topPx}px;height:${htPx}px;background:${a.color};color:${a.textColor||'#fff'};"
        onclick="openPopup(decodeURIComponent('${dataAttr}'))"
        title="${a.name}">
        <div class="artist-name">${shortName}</div>
        ${htPx > 28 ? `<div class="artist-time">${dispT}</div>` : ''}
      </button>`;
    }).join('');
    return `<div class="stage-col" style="height:${totalPx}px;">${gridLinesHTML}${blocks}</div>`;
  });

  const bodyHTML =
    `<div class="grid-body">` +
    `<div class="time-col" style="height:${totalPx}px;">${timeLabels.join('')}</div>` +
    stageCols.join('') +
    `</div>`;

  document.getElementById('scheduleInner').innerHTML = stageHeaderHTML + bodyHTML;

  // Update day label
  document.getElementById('dayLabel').textContent =
    `${currentDay}, ${DAY_DATES[currentDay]} · ${TZ_LABELS[currentTZ]} — ${TZ_LOCS[currentTZ]}`;

  // Update tabs
  document.querySelectorAll('.day-tab').forEach((t, i) => {
    t.classList.toggle('active', ['Friday','Saturday','Sunday'][i] === currentDay);
  });
}

function openPopup(jsonStr) {
  const a   = JSON.parse(jsonStr);
  const off = TZ_OFFSETS[currentTZ];
  const dispT = fmt(a.startMin, off) + '–' + fmt(a.endMin, off) + ' ' + TZ_LABELS[currentTZ];

  document.getElementById('popupStage').textContent = a.stage;
  document.getElementById('popupStage').style.cssText =
    `background:${a.color};color:${a.textColor||'#fff'};`;
  document.getElementById('popupArtist').innerHTML =
    a.name + (a.w2only ? '<span class="w2badge">W2 ONLY</span>' : '');
  document.getElementById('popupTime').textContent = dispT;

  const set = (rowId, valId, val) => {
    const ok = val && val.trim();
    document.getElementById(rowId).style.display = ok ? '' : 'none';
    if (ok) document.getElementById(valId).textContent = val;
  };
  set('rowGenre',  'popupGenre',  a.genre);
  set('rowRating', 'popupRating', a.rating);
  set('rowVibe',   'popupVibe',   a.vibe);
  set('rowPraise', 'popupPraise', a.praise);
  set('rowSnark',  'popupSnark',  a.snark);
  set('rowMisc',   'popupMisc',   a.misc);

  const btns = [];
  if (a.appleMusic) btns.push(`<a href="${a.appleMusic}" target="_blank" class="popup-btn btn-apple">Apple Music</a>`);
  if (a.spotify)    btns.push(`<a href="${a.spotify}"    target="_blank" class="popup-btn btn-spotify">Spotify</a>`);
  const ytUrl = STAGE_YT[a.stage] || 'https://www.youtube.com/results?search_query=coachella+2026+live';
  btns.push(`<a href="${ytUrl}" target="_blank" class="popup-btn btn-youtube">▶ Watch on YouTube</a>`);
  document.getElementById('popupButtons').innerHTML = btns.join('');

  document.getElementById('overlay').classList.add('active');
}

function closePopup(e) {
  if (!e || e.target === document.getElementById('overlay')) {
    document.getElementById('overlay').classList.remove('active');
  }
}

function switchDay(day) { currentDay = day; renderSchedule(); }
function switchTZ(tz)   { currentTZ  = tz;  renderSchedule(); }

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopup(); });
renderSchedule();
</script>
</body>
